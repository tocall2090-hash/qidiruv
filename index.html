<!    padding: 12px !important;
    box-sizing: border-box !important;
  <!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qidir!</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #202124;
      --sub: #5f6368;
      --border: #dfe1e5;
      --menu: #ffffff;
      --hover: #f1f3f4;
    }

    body.dark {
      --bg: #202124;
      --text: #e8eaed;
      --sub: #9aa0a6;
      --border: #5f6368;
      --menu: #292a2d;
      --hover: #3c4043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('IMG_20261125_135637_1.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: 0.3s;
    }

    /* Yuqori qism va Menyu */
    header {
      display: flex;
      justify-content: flex-start;
      padding: 15px 20px;
      position: relative;
      z-index: 1000;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(4px);
    }

    .menu-btn span {
      width: 20px;
      height: 2.5px;
      background: #ffffff;
      border-radius: 2px;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 68px;
      left: 20px;
      width: 240px;
      background: var(--menu);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      padding: 15px;
      z-index: 1001;
    }

    .dropdown.open {
      display: block;
    }

    .theme-btn {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .theme-btn:hover {
      background: var(--hover);
    }

    /* Asosiy markaziy qism */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px 60px;
      width: 100%;
    }

    /* Rangli Qidir! logotipi */
    .logo {
      font-size: 64px;
      font-weight: bold;
      letter-spacing: -2px;
      margin-bottom: 22px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      user-select: none;
    }

    .logo span:nth-child(1) { color: #4285F4; } /* Q */
    .logo span:nth-child(2) { color: #EA4335; } /* i */
    .logo span:nth-child(3) { color: #FBBC05; } /* d */
    .logo span:nth-child(4) { color: #4285F4; } /* i */
    .logo span:nth-child(5) { color: #34A853; } /* r */
    .logo span:nth-child(6) { color: #EA4335; } /* ! */

    /* Google CSE Qidiruv qutisi dizayni */
    .google-box {
      width: 100%;
      max-width: 600px;
    }

    .gsc-control-cse {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
    }

    form.gsc-search-box {
      margin: 0 !important;
    }

    table.gsc-search-box {
      background: rgba(255, 255, 255, 0.96) !important;
      border-radius: 30px !important;
      padding: 4px 10px !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3) !important;
      overflow: hidden;
    }

    .gsc-input-box {
      border: none !important;
      background: transparent !important;
    }

    input.gsc-input {
      font-size: 16px !important;
      color: #202124 !important;
      background: transparent !important;
    }

    button.gsc-search-button-v2 {
      border-radius: 24px !important;
      padding: 10px 18px !important;
      background-color: #4285F4 !important;
      border: none !important;
      cursor: pointer !important;
    }

    /* Qidiruv natijalari (sayt ichida ochiladi) */
    .gsc-results-wrapper-overlay,
    .gsc-results-wrapper-visible {
      background: #f3f4f6 !important;
      border-radius: 16px !important;
      padding: 14px !important;
      margin-top: 15px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25) !important;
    }

    .gsc-webResult.gsc-result {
      background: #ffffff !important;
      border-radius: 12px !important;
      padding: 14px !important;
      margin-bottom: 10px !important;
      border: none !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06) !important;
    }

    .gs-title a {
      font-size: 17px !important;
      color: #1a0dab !important;
      text-decoration: none !important;
    }

    .gs-snippet {
      font-size: 14px !important;
      color: #374151 !important;
      margin-top: 5px !important;
    }
  </style>
</head>
<body>

  <header>
    <button class="menu-btn" onclick="toggleMenu()" aria-label="Menyu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="dropdown" id="dropdownMenu">
      <button class="theme-btn" onclick="toggleTheme()">🌓 Tungi / Kunduzgi rejim</button>
    </div>
  </header>

  <main>
    <div class="logo">
      <span>Q</span><span>i</span><span>d</span><span>i</span><span>r</span><span>!</span>
    </div>

    <div class="google-box">
      <div class="gcse-search"></div>
    </div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('open');
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    window.addEventListener('click', function(e) {
      if (!e.target.closest('.menu-btn') && !e.target.closest('.dropdown')) {
        document.getElementById('dropdownMenu').classList.remove('open');
      }
    });
  </script>

  <!-- Google Programmable Search Engine (sayt ichida qidirish uchun) -->
  <script async src="https://google.com"></script>

</body>
</html>
