<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qidir!</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #202124;
      --sub: #5f6368;
      --border: #dfe1e5;
      --menu: #ffffff;
      --hover: #f1f3f4;
      --card: rgba(255, 255, 255, 0.96);
    }

    body.dark {
      --bg: #202124;
      --text: #e8eaed;
      --sub: #9aa0a6;
      --border: #5f6368;
      --menu: #292a2d;
      --hover: #3c4043;
      --card: rgba(41, 42, 45, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('IMG_20261125_135637_1.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: 0.3s;
    }

    /* Chap tepadagi menyu tugmasi */
    header {
      display: flex;
      justify-content: flex-start;
      padding: 15px 20px;
      position: relative;
      z-index: 1000;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(4px);
    }

    .menu-btn span {
      width: 20px;
      height: 2.5px;
      background: #ffffff;
      border-radius: 2px;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 68px;
      left: 20px;
      width: 230px;
      background: var(--menu);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      padding: 12px;
      z-index: 1001;
    }

    .dropdown.open {
      display: block;
    }

    .theme-btn {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    /* Markaziy qism */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 60px;
      width: 100%;
    }

    /* Qidir! yozuvi */
    .logo {
      font-size: 64px;
      font-weight: bold;
      letter-spacing: -2px;
      margin-bottom: 22px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .logo span:nth-child(1) { color: #4285F4; }
    .logo span:nth-child(2) { color: #EA4335; }
    .logo span:nth-child(3) { color: #FBBC05; }
    .logo span:nth-child(4) { color: #4285F4; }
    .logo span:nth-child(5) { color: #34A853; }
    .logo span:nth-child(6) { color: #EA4335; }

    /* O'zimizning tayyor qidiruv panelimiz (100% ko'rinadi) */
    .search-form {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 30px;
      padding: 6px 8px 6px 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .search-form input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      color: #202124;
      padding: 10px 6px;
    }

    .search-form button {
      border: none;
      background: #4285F4;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      padding: 11px 20px;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-form button:hover {
      background: #3367D6;
    }

    /* Sayt ichida chiqadigan qidiruv natijalari */
    .results-box {
      width: 100%;
      max-width: 560px;
      margin-top: 18px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .result-card {
      background: var(--card);
      padding: 14px 16px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
    }

    .result-card h3 {
      font-size: 17px;
      color: #1a73e8;
      margin-bottom: 6px;
    }

    body.dark .result-card h3 {
      color: #8ab4f8;
    }

    .result-card p {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
    }

    .status-text {
      text-align: center;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <button class="menu-btn" onclick="toggleMenu()" aria-label="Menyu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="dropdown" id="dropdownMenu">
      <button class="theme-btn" onclick="toggleTheme()">🌓 Tungi / Kunduzgi rejim</button>
    </div>
  </header>

  <main>
    <div class="logo">
      <span>Q</span><span>i</span><span>d</span><span>i</span><span>r</span><span>!</span>
    </div>

        <form class="search-form" onsubmit="startSearch(event)" style="display:flex; align-items:center; width:100%; max-width:560px; background:rgba(255,255,255,0.97); border-radius:30px; padding:6px 8px 6px 16px; box-shadow:0 6px 20px rgba(0,0,0,0.35); gap:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Nimani qidiramiz..." required style="flex:1; border:none; outline:none; background:transparent; font-size:16px; color:#202124; padding:10px 4px; min-width:0;">
      <button type="submit" aria-label="Qidirish" style="border:none; background:#4285F4; color:#fff; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>


    <!-- Natijalar shu yerda (sayt ichida) ochiladi -->
    <div class="results-box" id="resultsBox"></div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('open');
    }
    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('open');
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    window.addEventListener('click', function(e) {
      if (!e.target.closest('.menu-btn') && !e.target.closest('.dropdown')) {
        document.getElementById('dropdownMenu').classList.remove('open');
      }
    });

    function startSearch(event) {
      event.preventDefault();
      var query = document.getElementById('searchInput').value.trim();
      var resultsBox = document.getElementById('resultsBox');
      if (!query) return;

      resultsBox.style.display = 'flex';
      resultsBox.innerHTML = '<div class="status-text">Qidirilmoqda...</div>';

      // Eski skriptni tozalash
      var oldScript = document.getElementById('wikiSearchScript');
      if (oldScript) oldScript.remove();

      // O'zbekcha Wikipediadan bloklanmasdan qidirish
      var script = document.createElement('script');
      script.id = 'wikiSearchScript';
      script.src = 'https://wikipedia.org' + encodeURIComponent(query) + '&format=json&callback=natijalarniKorsat';

      document.body.appendChild(script);
    }

    function natijalarniKorsat(data) {
      var resultsBox = document.getElementById('resultsBox');
      var items = (data && data.query && data.query.search) ? data.query.search : [];

      if (items.length === 0) {
        resultsBox.innerHTML = '<div class="status-text">Hech narsa topilmadi. Boshqa so‘z yozib ko‘ring.</div>';
        return;
      }

      resultsBox.innerHTML = '';
      items.slice(0, 6).forEach(function(item) {
        var cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, '');
        var card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = '<h3>' + item.title + '</h3><p>' + cleanSnippet + '...</p>';
        resultsBox.appendChild(card);
      });
    }
  </script>

          resultsBox.appendChild(card);
        });
      } catch (err) {
        resultsBox.innerHTML = '<div class="status-text">Internet bilan bog‘lanishda xatolik yuz berdi.</div>';
      }
    }
  </script>

</body>
</html>
